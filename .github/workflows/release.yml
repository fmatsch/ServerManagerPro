name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional: Code-Signing. Ohne diese Secrets bleiben EXE und Setup unsigniert (siehe README, Abschnitt Signierung).
      SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version ermitteln
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/ServerManagerPro/ServerManagerPro.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version $v"

      - name: Build
        run: dotnet build src/ServerManagerPro -c Release

      - name: Selbsttest
        shell: pwsh
        run: |
          dotnet src/ServerManagerPro/bin/Release/net8.0-windows/ServerManagerPro.dll --selftest selftest.txt
          Get-Content selftest.txt | Select-Object -First 40

      - name: Publish (self-contained, eine Datei)
        run: dotnet publish src/ServerManagerPro -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist

      - name: EXE signieren (optional)
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PASSWORD dist\ServerManagerPro.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool fehlgeschlagen" }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" installer\ServerManagerPro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }

      - name: Installer signieren (optional)
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PASSWORD "dist\ServerManagerPro-Setup-${{ steps.ver.outputs.version }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool fehlgeschlagen" }

      - name: ZIP und Prüfsummen
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist\ServerManagerPro.exe -DestinationPath "dist\ServerManagerPro-v$v-win-x64.zip" -Force
          $files = "dist\ServerManagerPro-v$v-win-x64.zip", "dist\ServerManagerPro-Setup-$v.exe"
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, (Split-Path $_ -Leaf) } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ServerManagerPro-${{ steps.ver.outputs.version }}
          path: |
            dist/ServerManagerPro-v*-win-x64.zip
            dist/ServerManagerPro-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ServerManagerPro-v*-win-x64.zip
            dist/ServerManagerPro-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
