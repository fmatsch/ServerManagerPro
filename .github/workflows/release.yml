name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/ServerManagerPro -c Release
      - name: Selbsttest
        run: |
          dotnet src/ServerManagerPro/bin/Release/net8.0-windows/ServerManagerPro.dll --selftest selftest.txt
          Get-Content selftest.txt
      - name: Publish (self-contained, eine Datei)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish src/ServerManagerPro -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist
          Compress-Archive -Path dist/ServerManagerPro.exe -DestinationPath ServerManagerPro-${{ github.ref_name }}-win-x64.zip
          (Get-FileHash ServerManagerPro-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash | Out-File SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ServerManagerPro-*-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
